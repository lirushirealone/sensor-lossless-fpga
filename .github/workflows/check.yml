name: source-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_release.py
      - run: python tools/run_tests.py
      - run: python tools/check_native.py
      - run: python tools/check_collaboration.py
      - run: python skill/check_examples.py
